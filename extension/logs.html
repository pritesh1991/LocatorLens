<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocatorLens - Server Logs</title>
    <link rel="stylesheet" href="logs.css">
</head>

<body>
    <div class="logs-page">
        <!-- Header -->
        <div class="logs-header">
            <div class="header-left">
                <img src="icons/icon_optimized.svg" width="28" height="28" alt="LocatorLens">
                <h1>LocatorLens Server Logs</h1>
            </div>
            <div class="header-right">
                <div class="filter-controls">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="info">Info</button>
                    <button class="filter-btn" data-filter="warning">Warning</button>
                    <button class="filter-btn" data-filter="error">Error</button>
                </div>
                <button id="clear-logs-btn" class="clear-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Clear Logs
                </button>
            </div>
        </div>

        <!-- Logs Display Area -->
        <div class="logs-content" id="logs-content">
            <div class="empty-state" id="empty-state">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <p>No logs yet</p>
                <span>Logs will appear here when servers are running</span>
            </div>
        </div>
    </div>

    <script src="logs.js"></script>
</body>

</html>
