<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocatorLens Inspector</title>
    <link rel="stylesheet" href="inspector.css">
</head>

<body>
    <div class="app">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="top-bar-left">
                <img src="../icons/icon_optimized.svg" width="32" height="32" alt="LocatorLens">
                <h1>LocatorLens</h1>
                <div class="device-info">
                    <span id="device-name">Loading...</span>
                </div>
            </div>
            <div class="top-bar-right">
                <button id="mode-toggle-btn" class="icon-btn mode-btn" title="Toggle Inspect/Interact Mode">
                    <svg id="inspect-icon" width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                    <svg id="interact-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        style="display: none;">
                        <path d="M15 10L11 14L9 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                        <path
                            d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z"
                            stroke="currentColor" stroke-width="2" />
                    </svg>
                    <span id="mode-label">Inspect</span>
                </button>
                <button id="theme-toggle-btn" class="icon-btn" title="Toggle Light/Dark Theme">
                    <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
                <button id="refresh-btn" class="icon-btn" title="Refresh Page Source">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path
                            d="M21 10C21 10 18.995 7.26822 17.3662 5.63824C15.7373 4.00827 13.4864 3 11 3C6.02944 3 2 7.02944 2 12C2 16.9706 6.02944 21 11 21C15.1031 21 18.5649 18.2543 19.6482 14.5M21 10V4M21 10H15"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
                <button id="disconnect-btn" class="icon-btn" title="Disconnect">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content">
            <!-- Left Panel: Screen Mirror -->
            <div class="panel panel-screen">
                <div class="panel-header">
                    <h2>Screen Mirror</h2>
                    <div class="panel-actions">
                        <span id="fps-indicator" class="fps-indicator">0 FPS</span>
                    </div>
                </div>
                <div class="panel-body">
                    <div id="screen-container" class="screen-container">
                        <div id="screen-overlay" class="screen-overlay"></div>
                        <img id="screen-image" class="screen-image" alt="Device screen">
                        <div id="screen-loading" class="screen-loading">
                            <div class="spinner"></div>
                            <p>Connecting to device...</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Middle Panel: Page Source -->
            <div class="panel panel-source">
                <div class="panel-header">
                    <h2>Page Source</h2>
                    <div class="panel-actions">
                        <input type="text" id="search-input" class="search-input" placeholder="Search in XML...">
                    </div>
                </div>
                <div class="panel-body">
                    <div id="source-tree" class="source-tree"></div>
                    <div id="source-loading" class="source-loading hidden">
                        <div class="spinner"></div>
                        <p>Loading page source...</p>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Element Details -->
            <div class="panel panel-details">
                <div class="panel-header">
                    <h2>Element Details</h2>
                </div>
                <div class="panel-body">
                    <div id="element-details" class="element-details">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none">
                                <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor"
                                    stroke-width="1.5" />
                                <path d="M9 9L15 15M15 9L9 15" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round" />
                            </svg>
                            <p>Select an element to view details</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">
                <span class="status-dot" id="connection-dot"></span>
                <span id="connection-status">Connecting...</span>
            </div>
            <div class="status-item">
                <span id="element-count">0 elements</span>
            </div>
        </div>
    </div>

    <script src="../analytics.js"></script>
    <script src="locator-generator.js"></script>
    <script src="inspector.js"></script>
</body>

</html>
