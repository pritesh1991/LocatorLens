<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LocatorLens</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon_optimized.svg" width="28" height="28" alt="LocatorLens">
        <h1>LocatorLens</h1>
      </div>
    </div>

    <!-- Server Control Panel -->
    <div class="server-control">
      <div class="server-status-row">
        <div class="server-indicator">
          <span id="backend-dot" class="status-dot"></span>
          <span>Backend</span>
        </div>
        <div class="server-indicator">
          <span id="appium-dot" class="status-dot"></span>
          <span>Appium</span>
        </div>
      </div>
      <button id="server-btn" class="btn btn-secondary btn-sm">
        Start Servers
      </button>
    </div>

    <div class="logs-container">
      <div class="logs-header" id="logs-toggle">
        <span>Server Logs</span>
        <div class="logs-header-actions">
          <button id="open-logs-btn" class="open-logs-btn" title="Open in New Tab">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3" />
            </svg>
          </button>
          <span class="toggle-icon">▼</span>
        </div>
      </div>
      <div class="logs-content" id="logs-content">
        <!-- Logs will appear here -->
      </div>
    </div>


    <div id="error-message" class="error-message hidden"></div>

    <div class="form-group">
      <label for="platform-select">Platform</label>
      <select id="platform-select" class="select-input">
        <option value="">Select Platform</option>
        <option value="android">Android</option>
        <option value="ios">iOS</option>
      </select>
    </div>

    <div class="form-group">
      <label for="device-select">Device / Simulator</label>
      <select id="device-select" class="select-input" disabled>
        <option value="">Select a platform first</option>
      </select>
    </div>

    <button id="connect-btn" class="btn btn-primary" disabled>
      <svg class="btn-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="2" />
        <path d="M8 5V11M5 8H11" stroke="currentColor" stroke-width="2" />
      </svg>
      Connect to Device
    </button>


    <div class="footer">
      <a href="#" id="help-link" title="Help & Prerequisites">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        Help
      </a>
      <a href="#" id="settings-link">Settings</a>
      <span class="version">v1.0.0</span>
    </div>

    <!-- Error Modal -->
    <div id="error-modal" class="error-modal hidden">
      <div class="error-modal-content">
        <div class="error-modal-header">
          <h3>Server Startup Failed</h3>
          <button id="error-modal-close" class="error-modal-close">&times;</button>
        </div>
        <div class="error-modal-body" id="error-modal-body">
          <!-- Error content will be inserted here -->
        </div>
        <div class="error-modal-footer">
          <button id="error-help-btn" class="btn btn-primary btn-sm">View Help & Prerequisites</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
